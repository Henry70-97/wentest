<!DOCTYPE html>
<html>
<head>
  <title>Pay Now</title>
</head>
<body>

<h2>M-Pesa Payment</h2>

<input id="phone" placeholder="2547XXXXXXXX"><br><br>
<input id="amount" placeholder="Amount"><br><br>

<button onclick="pay()">Pay</button>

<p id="status"></p>

<script>
async function pay() {
  const phone = document.getElementById("phone").value;
  const amount = document.getElementById("amount").value;

  document.getElementById("status").innerText = "Sending STK...";

  try {
    const res = await fetch("https://your-render-url.onrender.com/pay", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ phone, amount })
    });

    const data = await res.json();

    console.log(data);

    document.getElementById("status").innerText =
      "Check your phone for STK prompt 📲";

  } catch (err) {
    document.getElementById("status").innerText = "Error connecting to server";
  }
}
</script>

</body>
</html>
