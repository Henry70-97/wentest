<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Pesa STK Push Demo</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>💳 M-Pesa STK Push</h1>
                <p>Pay using Lipa Na M-Pesa</p>
            </div>

            <form id="paymentForm">
                <div class="form-group">
                    <label for="phoneNumber">📱 Phone Number</label>
                    <input 
                        type="tel" 
                        id="phoneNumber" 
                        placeholder="0712345678 or +254712345678"
                        required
                    >
                    <small>Enter the M-Pesa registered number</small>
                </div>

                <div class="form-group">
                    <label for="amount">💰 Amount (KES)</label>
                    <input 
                        type="number" 
                        id="amount" 
                        placeholder="10" 
                        min="1"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="accountReference">🏷️ Account Reference</label>
                    <input 
                        type="text" 
                        id="accountReference" 
                        placeholder="INV-001"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="transactionDesc">📝 Transaction Description</label>
                    <input 
                        type="text" 
                        id="transactionDesc" 
                        placeholder="Payment for services"
                        value="Payment"
                    >
                </div>

                <button type="submit" id="payButton">
                    <span class="button-text">Pay Now</span>
                    <span class="loader" style="display: none;"></span>
                </button>
            </form>

            <div id="status" class="status" style="display: none;"></div>
        </div>
    </div>

    <script>
        let checkoutRequestID = null;

        document.getElementById('paymentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const phoneNumber = document.getElementById('phoneNumber').value;
            const amount = document.getElementById('amount').value;
            const accountReference = document.getElementById('accountReference').value;
            const transactionDesc = document.getElementById('transactionDesc').value;

            // Show loading state
            const payButton = document.getElementById('payButton');
            const buttonText = payButton.querySelector('.button-text');
            const loader = payButton.querySelector('.loader');
            buttonText.style.display = 'none';
            loader.style.display = 'inline-block';
            payButton.disabled = true;

            // Hide previous status
            const statusDiv = document.getElementById('status');
            statusDiv.style.display = 'none';
            statusDiv.className = 'status';

            try {
                // Initiate STK Push
                const response = await fetch('/api/stk-push', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        phoneNumber,
                        amount,
                        accountReference,
                        transactionDesc
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Payment initiation failed');
                }

                // Store checkoutRequestID for query
                checkoutRequestID = data.data?.CheckoutRequestID;
                
                // Show success message
                showStatus('success', '✅ Payment initiated! Check your phone for the M-Pesa prompt. Enter your PIN to complete payment.');
                
                // Start polling for payment status if we have checkoutRequestID
                if (checkoutRequestID) {
                    setTimeout(() => pollPaymentStatus(checkoutRequestID), 5000);
                }

            } catch (error) {
                showStatus('error', '❌ ' + error.message);
            } finally {
                // Reset button state
                buttonText.style.display = 'inline';
                loader.style.display = 'none';
                payButton.disabled = false;
            }
        });

        async function pollPaymentStatus(checkoutRequestID, attempt = 1) {
            const maxAttempts = 12; // Poll for ~60 seconds
            const delay = 5000; // 5 seconds

            if (attempt > maxAttempts) {
                showStatus('info', '⏰ Payment status check timeout. Please check your M-Pesa messages for confirmation.');
                return;
            }

            try {
                const response = await fetch('/api/stk-query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ checkoutRequestID })
                });

                const data = await response.json();

                if (data.success && data.data.ResultCode === '0') {
                    // Payment successful
                    showStatus('success', '✅ Payment successful! Thank you for您的付款.');
                    return;
                } else if (data.data.ResultCode !== '1037') { // 1037 means pending
                    // Payment failed
                    showStatus('error', '❌ Payment failed: ' + (data.data.ResultDesc || 'Unknown error'));
                    return;
                }

                // Still pending, poll again
                setTimeout(() => pollPaymentStatus(checkoutRequestID, attempt + 1), delay);
                
            } catch (error) {
                console.error('Polling error:', error);
                // Continue polling on error
                setTimeout(() => pollPaymentStatus(checkoutRequestID, attempt + 1), delay);
            }
        }

        function showStatus(type, message) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status status-${type}`;
            statusDiv.innerHTML = message;
            statusDiv.style.display = 'block';

            // Auto-hide after 10 seconds for success/error
            if (type !== 'info') {
                setTimeout(() => {
                    if (statusDiv.style.display === 'block') {
                        statusDiv.style.display = 'none';
                    }
                }, 10000);
            }
        }
    </script>
</body>
</html>
