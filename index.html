<!DOCTYPE html>
<html>
<head>
  <title>Pay with M-Pesa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="font-family: Arial; text-align: center; margin-top: 50px;">

  <h2>💳 Pay with M-Pesa</h2>

  <input id="phone" placeholder="2547XXXXXXXX" 
         style="padding:10px; width:250px; margin:10px;"><br>

  <input id="amount" placeholder="Amount" 
         style="padding:10px; width:250px; margin:10px;"><br>

  <button onclick="pay()" 
          style="padding:12px 20px; background:green; color:white; border:none;">
    Pay Now
  </button>

  <p id="status"></p>

  <script>
    async function pay() {
      const phone = document.getElementById("phone").value;
      const amount = document.getElementById("amount").value;
      const status = document.getElementById("status");

      status.innerText = "Processing payment...";

      try {
        const res = await fetch("https://render-stk.onrender.com", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ phone, amount })
        });

        const data = await res.json();

        if (data.url) {
          status.innerText = "Redirecting to payment...";
          window.location.href = data.url;
        } else {
          status.innerText = "Error: " + JSON.stringify(data);
        }

      } catch (err) {
        status.innerText = "Failed to connect to server";
      }
    }
  </script>

</body>
</html>
